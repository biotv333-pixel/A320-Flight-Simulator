name: Publish Roblox test place
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type TEST to deploy only to a separate test place"
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish-test:
    if: ${{ inputs.confirmation == 'TEST' }}
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
      ROBLOX_TEST_UNIVERSE_ID: "10774182437"
      ROBLOX_TEST_PLACE_ID: "86173227615947"
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated test target
        run: |
          test -n "$ROBLOX_API_KEY" || { echo "Missing Roblox API secret"; exit 1; }
          test -n "$ROBLOX_TEST_UNIVERSE_ID" || { echo "Missing ROBLOX_TEST_UNIVERSE_ID"; exit 1; }
          test -n "$ROBLOX_TEST_PLACE_ID" || { echo "Missing ROBLOX_TEST_PLACE_ID"; exit 1; }
          test "$ROBLOX_TEST_UNIVERSE_ID" != "2767957106" || { echo "Production universe blocked"; exit 1; }
          test "$ROBLOX_TEST_PLACE_ID" != "7141996164" || { echo "Production place blocked"; exit 1; }
      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.5.1/rojo-7.5.1-linux-x86_64.zip
          unzip -o rojo.zip
          chmod +x rojo
          sudo mv rojo /usr/local/bin/rojo
      - name: Build Roblox place
        run: rojo build default.project.json -o game.rbxl
      - name: Publish to test place only
        run: |
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @game.rbxl \
            "https://apis.roblox.com/universes/v1/$ROBLOX_TEST_UNIVERSE_ID/places/$ROBLOX_TEST_PLACE_ID/versions?versionType=Published"
