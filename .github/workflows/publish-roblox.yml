name: Publish Roblox place
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PUBLISH to deploy to the existing Roblox place"
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: ${{ inputs.confirmation == 'PUBLISH' }}
    runs-on: ubuntu-latest
    environment: roblox-production
    env:
      ROBLOX_UNIVERSE_ID: "2767957106"
      ROBLOX_PLACE_ID: "7141996164"
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check publishing credentials
        run: |
          test -n "$ROBLOX_API_KEY" || { echo "Missing ROBLOX_OPEN_CLOUD_API_KEY secret"; exit 1; }
      - name: Install Rojo
        run: |
          curl -fsSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.5.1/rojo-7.5.1-linux-x86_64.zip
          unzip -o rojo.zip
          chmod +x rojo
          sudo mv rojo /usr/local/bin/rojo
      - name: Build Roblox place
        run: rojo build default.project.json -o game.rbxl
      - name: Publish place via Roblox Open Cloud
        run: |
          curl --fail-with-body --show-error --silent --retry 2 \
            -X POST \
            -H "x-api-key: $ROBLOX_API_KEY" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @game.rbxl \
            "https://apis.roblox.com/universes/v1/$ROBLOX_UNIVERSE_ID/places/$ROBLOX_PLACE_ID/versions?versionType=Published"
